[project]
name = "bic"
version = "0.1.0"
description = "Simulation du pipeline de déclaration à un Bureau d'Information sur le Crédit (BIC) UEMOA"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0,<3.0",
    "pymysql>=1.1,<2.0",
    "lxml>=5.0,<6.0",
    "pandas>=2.1,<3.0",
    "rapidfuzz>=3.6,<4.0",
    "scikit-learn>=1.4,<2.0",
    "networkx>=3.2,<4.0",
    "numpy>=1.26,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.5,<1.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: tests nécessitant une base MySQL (disponible uniquement en CI)",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
